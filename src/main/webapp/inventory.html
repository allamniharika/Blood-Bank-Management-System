<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventory Login</title>

    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: red;
            min-height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 500px;
        }

        label {
            font-weight: bold;
        }

        .disabled-btn {
            background-color: #6c757d;
            color: white;
            cursor: not-allowed;
            opacity: 0.65;
            pointer-events: none;
        }

        .login-btn {
            width: 100%;
        }

        .action-btn {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">

        <div class="login-container shadow p-4 rounded bg-white">

            <h2 class="text-center mb-4">
                Inventory Login
            </h2>

            <!-- LOGIN -->
            <form action="InventoryLogin" method="POST">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input type="text"
                           class="form-control"
                           id="username"
                           name="username"
                           placeholder="Enter your username"
                           required>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password"
                           class="form-control"
                           id="password"
                           name="password"
                           placeholder="Enter your password"
                           required>

                </div>

                <button type="submit"
                        class="btn btn-primary login-btn">
                    Login
                </button>

            </form>


            <!-- VIEW DONORS - DISABLED BEFORE LOGIN -->
            <button type="button"
                    class="btn disabled-btn action-btn"
                    disabled>
                View Donors
            </button>


            <!-- VIEW RECIPIENTS - DISABLED BEFORE LOGIN -->
            <button type="button"
                    class="btn disabled-btn action-btn"
                    disabled>
                View Recipients
            </button>


            <!-- BACK -->
            <button type="button"
                    class="btn btn-secondary action-btn"
                    onclick="goBack()">
                Back
            </button>

        </div>

    </div>


    <script>

        function goBack() {
            window.history.back();
        }

    </script>

</body>

</html>
