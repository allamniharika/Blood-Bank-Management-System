<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Blood Confirmation</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4 mx-auto"
         style="max-width:550px;">

        <h2 class="text-center mb-4">
            Blood Given / Received Confirmation
        </h2>

        <p class="text-center">
            Enter your transaction ID and confirm your action.
        </p>

        <form method="POST"
              action="BloodConfirmation">

            <label class="form-label">
                Transaction ID
            </label>

            <input
                type="number"
                name="transaction_id"
                class="form-control mb-3"
                required>

            <label class="form-label">
                Select your role
            </label>

            <select
                name="role"
                class="form-select mb-3"
                required>

                <option value="">
                    Select
                </option>

                <option value="donor">
                    Donor - Blood Given
                </option>

                <option value="receiver">
                    Receiver - Blood Received
                </option>

            </select>

            <button
                type="submit"
                class="btn btn-danger w-100">

                Confirm Blood Transaction

            </button>

        </form>

    </div>

</div>

</body>
</html>
